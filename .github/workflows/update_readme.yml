name: Actualizar proyectos del README
 
on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas
  workflow_dispatch:         # botón "Run workflow" para ejecutarlo a mano
 
permissions:
  contents: write
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Generar tarjetas con tus repos más recientes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repos=$(gh repo list "${{ github.repository_owner }}" \
            --visibility public --source --no-archived --limit 100 \
            --json name,pushedAt \
            --jq 'map(select(.name != "${{ github.repository_owner }}")) | sort_by(.pushedAt) | reverse | .[:4] | .[].name')
          block=""
          for r in $repos; do
            block+="[![$r](https://github-readme-stats.vercel.app/api/pin/?username=${{ github.repository_owner }}&repo=$r&theme=radical&hide_border=true)](https://github.com/${{ github.repository_owner }}/$r)"$'\n'
          done
          export BLOCK="$block"
          python3 - <<'PY'
          import os, re
          s = open('README.md', encoding='utf-8').read()
          new = re.sub(
              r'(<!-- PROJECTS:START -->).*?(<!-- PROJECTS:END -->)',
              lambda m: m.group(1) + '\n' + os.environ['BLOCK'] + m.group(2),
              s, flags=re.S)
          open('README.md', 'w', encoding='utf-8').write(new)
          PY
 
      - name: Guardar cambios si los hay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: actualizar proyectos" && git push)
