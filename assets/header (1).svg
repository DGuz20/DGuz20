<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">DGuz20 — Web Development and CTF</title>
  <desc id="desc">Cyberpunk banner in black, purple and electric blue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080812"/>
      <stop offset="55%" stop-color="#15102b"/>
      <stop offset="100%" stop-color="#061426"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#8b5cf6" stroke-opacity=".14" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <g fill="none" stroke="#38bdf8" stroke-opacity=".28">
    <path d="M0 64H180L220 104H330"/>
    <path d="M1200 82H1030L995 117H900"/>
    <path d="M0 276H160L205 231H275"/>
    <path d="M1200 265H1055L1010 220H940"/>
  </g>
  <g fill="#a78bfa" opacity=".75">
    <circle cx="180" cy="64" r="2.5"/><circle cx="1030" cy="82" r="2.5"/>
    <circle cx="160" cy="276" r="2.5"/><circle cx="1055" cy="265" r="2.5"/>
  </g>
  <path d="M110 170H1090" stroke="url(#line)" stroke-width="2">
    <animate attributeName="opacity" values=".25;1;.25" dur="3.5s" repeatCount="indefinite"/>
  </path>
  <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle">
    <text x="600" y="74" font-size="16" fill="#60a5fa" letter-spacing="5">WEB DEVELOPMENT // CTF</text>
    <text x="600" y="160" font-size="66" font-weight="700" fill="#f5f3ff" filter="url(#glow)">DGuz20</text>
    <text x="600" y="208" font-size="19" fill="#c4b5fd">Gustavo · Developer in training</text>
    <text x="600" y="250" font-size="15" fill="#7dd3fc">HTML  /  CSS  /  JS  /  PHP  /  SQL  /  PYTHON</text>
    <text x="600" y="305" font-size="13" fill="#a78bfa" letter-spacing="3">[ LEARN ] — [ BUILD ] — [ BREAK ] — [ IMPROVE ]</text>
  </g>
  <rect x="30" y="30" width="1140" height="280" rx="12" fill="none" stroke="#7c3aed" stroke-opacity=".55"/>
  <rect x="30" y="30" width="1140" height="280" rx="12" fill="none" stroke="#38bdf8" stroke-opacity=".35" stroke-dasharray="4 12">
    <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
